name: CPU Python validation
'on':
  pull_request:
    branches:
    - master
  push:
    branches:
    - master
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Checkout exact PR head
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
      env:
        AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/python-tools-${{ github.run_id }}-${{ github.run_attempt }}-${{
          github.job }}
        RUNNER_TOOL_CACHE: ${{ runner.temp }}/python-tools-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job
          }}
    - name: Compile all tracked Python without imports
      shell: bash
      run: |-
        set -euo pipefail
        python3 - <<'PYCODE'
        from pathlib import Path
        import subprocess
        files = subprocess.check_output(['git', 'ls-files', '-z', '--', '*.py']).split(b'\0')
        files = [p for p in files if p]
        if not files:
            raise SystemExit('No tracked Python files found')
        for filename in files:
            path = Path(filename.decode())
            compile(path.read_bytes(), str(path), 'exec', dont_inherit=True)
        print(f'Compiled {len(files)} tracked Python sources without importing or executing them')
        PYCODE
    - name: Install isolated CPU test dependencies
      shell: bash
      run: |-
        set -euo pipefail
        test ! -e "$RUNNER_TEMP/ai-cpu-venv"
        python -m venv "$RUNNER_TEMP/ai-cpu-venv"
        "$RUNNER_TEMP/ai-cpu-venv/bin/python" -m pip install --no-cache-dir --only-binary=:all: \
          'https://download-r2.pytorch.org/whl/cpu/torch-2.4.0%2Bcpu-cp311-cp311-linux_x86_64.whl#sha256=14a7a8b595347dddca594f9e448b93ce68ce4f871acbd32cf04bda7c03664c0c' 'numpy==1.26.4' 'transformers==4.51.3'
        "$RUNNER_TEMP/ai-cpu-venv/bin/python" -m pip check
        printf 'CPU_TEST_PYTHON=%s\n' "$RUNNER_TEMP/ai-cpu-venv/bin/python" >> "$GITHUB_ENV"
    - name: Verify CPU-only dependency imports
      shell: bash
      run: |-
        set -euo pipefail
        "$CPU_TEST_PYTHON" - <<'PYCODE'
        import torch
        import numpy
        import transformers
        from transformers import Qwen3Config, Qwen3ForCausalLM
        assert torch.__version__ == '2.4.0+cpu', torch.__version__
        assert torch.version.cuda is None, 'CPU-only Torch wheel required'
        assert str(torch.get_default_device()) == 'cpu'
        assert numpy.__version__ == '1.26.4', numpy.__version__
        assert transformers.__version__ == '4.51.3', transformers.__version__
        print('CPU dependency imports and versions verified')
        PYCODE
    - name: Run chamber regression fixtures only
      shell: bash
      run: |-
        set -euo pipefail
        test -f tests/test_chamber_regressions.py
        "$CPU_TEST_PYTHON" -m unittest discover -s tests -p test_chamber_regressions.py -v
    - name: Run impossible-state fixtures only
      shell: bash
      run: |-
        set -euo pipefail
        test -f tests/test_impossible_states.py
        "$CPU_TEST_PYTHON" -m unittest discover -s tests -p test_impossible_states.py -v
